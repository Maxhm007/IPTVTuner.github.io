name: IPTV Self Heal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptv-self-heal.yml"
      - "scripts/iptv_self_heal.py"

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v4
        with:
          ref: main
          path: toolrepo

      - name: Checkout gh-pages playlist
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Check streams and replace failed URLs
        run: python3 toolrepo/scripts/iptv_self_heal.py site/IPTV-V008.m3u

      - name: Commit verified replacements
        working-directory: site
        run: |
          if git diff --quiet -- IPTV-V008.m3u; then
            echo "No verified replacements found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-V008.m3u
          git commit -m "Auto-heal IPTV stream links"
          git push origin HEAD:gh-pages
