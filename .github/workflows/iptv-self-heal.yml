name: IPTV Self Heal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptv-self-heal.yml"
      - "scripts/iptv_self_heal.py"

permissions:
  contents: write

concurrency:
  group: iptv-self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v4
        with:
          ref: main
          path: toolrepo

      - name: Checkout gh-pages playlist
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Check streams and update health state
        run: python3 toolrepo/scripts/iptv_self_heal.py site/IPTV-V008.m3u

      - name: Commit playlist and health state
        working-directory: site
        run: |
          CHANGES=$(git status --porcelain -- IPTV-V008.m3u IPTV-V008-health.json IPTV-V008-health.md)
          if [ -z "$CHANGES" ]; then
            echo "No IPTV state changes found."
            exit 0
          fi
          echo "$CHANGES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-V008.m3u IPTV-V008-health.json IPTV-V008-health.md
          git commit -m "Update IPTV self-heal state"
          git push origin HEAD:gh-pages
