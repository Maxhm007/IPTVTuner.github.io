name: IPTV Self Heal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptv-self-heal.yml"
      - "scripts/iptv_self_heal.py"
      - "scripts/iptv_self_heal_runner.py"
      - "scripts/iptv_issue_sync.py"
      - "config/iptv-approved-free.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: iptv-self-heal
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v4
        with:
          ref: main
          path: toolrepo

      - name: Checkout gh-pages playlist
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Checkout persistent healer state
        uses: actions/checkout@v4
        with:
          ref: iptv-state
          path: state
          fetch-depth: 0

      - name: Check streams and update health state
        run: python3 toolrepo/scripts/iptv_self_heal_runner.py site/IPTV-V008.m3u state

      - name: Sync inactive channel issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 toolrepo/scripts/iptv_issue_sync.py site/IPTV-V008.m3u

      - name: Commit playlist changes only
        working-directory: site
        run: |
          CHANGES=$(git status --porcelain -- IPTV-V008.m3u)
          if [ -z "$CHANGES" ]; then
            echo "No playlist changes found."
            exit 0
          fi
          echo "$CHANGES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-V008.m3u
          git commit -m "Auto-heal IPTV stream links"
          git push origin HEAD:gh-pages

      - name: Commit healer state separately
        working-directory: state
        run: |
          CHANGES=$(git status --porcelain -- IPTV-V008-health.json IPTV-V008-health.md)
          if [ -z "$CHANGES" ]; then
            echo "No healer state changes found."
            exit 0
          fi
          echo "$CHANGES"

          cp IPTV-V008-health.json /tmp/IPTV-V008-health.json
          cp IPTV-V008-health.md /tmp/IPTV-V008-health.md

          git fetch origin iptv-state
          git reset --hard origin/iptv-state

          cp /tmp/IPTV-V008-health.json IPTV-V008-health.json
          cp /tmp/IPTV-V008-health.md IPTV-V008-health.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-V008-health.json IPTV-V008-health.md
          if git diff --cached --quiet; then
            echo "No healer state changes after refresh."
            exit 0
          fi
          git commit -m "Update IPTV healer state"
          git push origin HEAD:iptv-state
