name: IPTV Self Heal Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptv-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: iptv-self-heal-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check self-heal freshness and dispatch if stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          api = os.environ["API"]
          workflow_file = "iptv-self-heal.yml"

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "IPTVTuner-Watchdog/1.0",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          runs_url = f"{api}/repos/{repo}/actions/workflows/{workflow_file}/runs?per_page=1"
          data = request("GET", runs_url) or {}
          runs = data.get("workflow_runs") or []

          stale = True
          if runs:
              latest = runs[0]
              created = datetime.fromisoformat(latest["created_at"].replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - created).total_seconds() / 60
              print(f"Latest self-heal run #{latest['run_number']} event={latest['event']} status={latest['status']} age={age_minutes:.1f}m")
              stale = age_minutes > 15

          if not stale:
              print("Self-heal is fresh; watchdog will not dispatch another run.")
          else:
              print("Self-heal is stale or missing; dispatching a recovery run.")
              dispatch_url = f"{api}/repos/{repo}/actions/workflows/{workflow_file}/dispatches"
              request("POST", dispatch_url, {"ref": "main"})
              print("Recovery dispatch accepted.")
          PY
