name: IPTV Self Heal Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptv-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: iptv-self-heal-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check self-heal freshness and dispatch if stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          api = os.environ["API"]
          workflow_file = "iptv-self-heal.yml"

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "IPTVTuner-Watchdog/1.0",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          freshness_limit = timedelta(minutes=15)
          # Allow for the 30-minute Self Heal job timeout and setup overhead.
          active_run_limit = timedelta(minutes=35)
          runs_url = f"{api}/repos/{repo}/actions/workflows/{workflow_file}/runs"

          def timestamp(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          now = datetime.now(timezone.utc)
          recent = request("GET", f"{runs_url}?branch=main&per_page=30")["workflow_runs"]
          active = [run for run in recent if run["status"] != "completed"]
          if active:
              overdue = []
              for run in active:
                  started = run.get("run_started_at") if run["status"] == "in_progress" else None
                  age = now - timestamp(started or run["created_at"])
                  print(f"Self Heal run #{run['run_number']} is {run['status']} ({age.total_seconds() / 60:.1f}m).")
                  if age > active_run_limit:
                      overdue.append(str(run["run_number"]))
              if overdue:
                  print(f"::error::Self Heal run(s) exceeded 35 minutes: {', '.join(overdue)}.")
                  raise SystemExit(1)
              print("Self Heal already has an active run. Skipping recovery dispatch.")
              raise SystemExit(0)

          successful = request("GET", f"{runs_url}?branch=main&status=success&per_page=10")["workflow_runs"]
          if successful:
              latest_success = max(successful, key=lambda run: timestamp(run["updated_at"]))
              age = now - timestamp(latest_success["updated_at"])
              print(f"Latest successful Self Heal run #{latest_success['run_number']} completed {age.total_seconds() / 60:.1f}m ago.")
              if age <= freshness_limit:
                  raise SystemExit(0)

          print("No fresh successful Self Heal run. Dispatching recovery.")
          dispatch_url = f"{api}/repos/{repo}/actions/workflows/{workflow_file}/dispatches"
          request("POST", dispatch_url, {"ref": "main"})
          print("Recovery dispatch accepted.")
          PY
